version: '3.8'

services:
  bot:
    build: .
    container_name: tg-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: tg-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: